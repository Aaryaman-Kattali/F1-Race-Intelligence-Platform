name: Batch Ingestion

on:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      year:
        description: "Season year to ingest"
        default: "2024"
        required: true
      circuits:
        description: 'Circuit name or "all"'
        default: "all"
        required: true

# Gate on GCP secrets — only runs when BigQuery is configured
jobs:
  ingest:
    name: Batch Ingest
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup GCP credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json

      - name: Run batch ingestion
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: |
          python -m src.ingestion.batch_ingest \
            --year ${{ github.event.inputs.year || '2024' }} \
            --circuits "${{ github.event.inputs.circuits || 'all' }}"
